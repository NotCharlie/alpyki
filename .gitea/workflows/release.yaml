name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  tests-release:
    name: Tests for release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: builtin:checkout
      - name: Run checks
        uses: ./.gitea/actions/lint
      - name: Run tests
        uses: ./.gitea/actions/test
        with:
          python-version: ${{ matrix.python-version }}

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: [tests-release]

    steps:
    - uses: builtin:checkout
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: pip install build
    - name: Validate that tag matches committed version
      run: python script/validate_version.py --expected_version=${{ gitea.ref_name }}
    - name: Build
      run: python -m build
    - name: Create Gitea release
      uses: gitea/gh-release@v1
      with:
        files: dist/*
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}

  generate-docs:
    name: Generate docs
    runs-on: ubuntu-latest
    needs: [publish]

    steps:
    - uses: builtin:checkout
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      shell: bash
      run: |
        pip install -e '.' -e '.[doc]'
    - name: Generate docs
      shell: bash
      run: |
        pdoc --output-dir docs pyfred
    - name: Upload docs artifact
      uses: gitea/upload-artifact@v1
      with:
        name: docs
        path: docs/
