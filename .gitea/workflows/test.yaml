name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches: "*"
    tags-ignore:
      - v*
      - test-v*

permissions:
  contents: read

jobs:
  tests-push-pr:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: builtin:checkout
      - name: Run checks
        uses: ./.gitea/actions/lint
      - name: Run tests
        uses: ./.gitea/actions/test
        with:
          python-version: ${{ matrix.python-version }}
