name: lint
description: Lint files
runs:
  using: composite
  steps:
    - name: Lint other Markdown files
      uses: DavidAnson/markdownlint-cli2-action@v25.0.0
      timeout-minutes: 2
      with:
        config: .markdownlint.yaml
        globs: "**/*.md"
    - uses: ricardochaves/python-lint@v1.4.0
      with:
        use-pylint: false
        use-pycodestyle: false
        use-flake8: true
        use-black: true
        use-mypy: false
        use-isort: false
