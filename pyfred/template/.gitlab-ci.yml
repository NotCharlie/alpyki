stages:
  - package
  - release

prepare_changelog:
  stage: package
  image: alpine:latest

  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
      when: always
    - when: never

  script:
    - apk add curl jq
    - 'curl -H "PRIVATE-TOKEN: $CI_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=$CI_COMMIT_TAG" | jq -r .notes > release_notes.md'

  artifacts:
    paths:
    - release_notes.md

package_on_tag:
  stage: package
  image: python:3.11

  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
      when: always
    - when: never

  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  cache:
    paths:
      - .cache/pip

  before_script:
    - python --version ; pip --version  # For debugging
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install git+https://github.com/acourtneybrown/pyfred-cli@main

  script:
    - pyfred package --name $CI_PROJECT_NAME

  artifacts:
    paths:
      - dist/

release_on_tag:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest

  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
      when: always
    - when: never

  needs:
    - job: prepare_changelog
      artifacts: true
    - job: package_on_tag
      artifacts: true

  script:
    - echo "running release job"

  artifacts:
    paths:
      - dist/

  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: release_notes.md
    assets:
      links:
        - name: "${CI_PROJECT_NAME}.alfredworkflow"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/${CI_PROJECT_NAME}.alfredworkflow"
