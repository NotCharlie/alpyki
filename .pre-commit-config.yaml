exclude: "docs/"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: requirements-txt-fixer
  - repo: https://github.com/pycqa/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        name: Black
  - repo: https://github.com/pycqa/isort
    rev: 6.1.0
    hooks:
      - id: isort
        name: isort
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
    - id: shellcheck
    - id: shfmt
  - repo: local
    hooks:
    - id: pdoc
      name: pdoc
      language: python
      language_version: python3
      pass_filenames: false
      additional_dependencies: ["pdoc==16.0.0", "argcomplete==3.7.2", "Jinja2==3.1.6"]
      entry: pdoc --no-search --output-dir docs alpyki
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies: [tokenize-rt==6.2.0]
